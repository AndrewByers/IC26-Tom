<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovation Framework Tracker - Date Formatted</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --past: #94a3b8;
            --future: #e2e8f0;
            --text: #0f172a;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 40px 20px 220px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 800px; }
        .header { text-align: center; margin-bottom: 30px; }

        .current-phase-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 40px;
            border: 1px solid #e2e8f0;
            border-top: 6px solid var(--primary);
            text-align: center;
        }

        .countdown-timer {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -1px;
            margin: 10px 0 5px 0;
        }

        .label {
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
        }

        /* Styling for the Client Info */
        .client-info {
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1e293b;
            border-top: 1px dashed #e2e8f0;
            padding-top: 15px;
            display: inline-block;
        }

        .stage-row {
            display: grid;
            grid-template-columns: 160px 1fr;
            margin-bottom: 12px;
            align-items: center;
        }

        .date-range { font-size: 0.85rem; color: #64748b; font-weight: 600; font-family: monospace; }
        
        .stage-pill {
            padding: 14px 20px;
            border-radius: 10px;
            background: var(--future);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stage-pill.past { background: #f1f5f9; color: #94a3b8; }
        .stage-pill.active { background: var(--primary); color: white; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2); }

        .master-progress-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 40px 0 60px 0;
            box-shadow: 0 -10px 15px -3px rgb(0 0 0 / 0.05);
            z-index: 100;
        }

        .progress-wrapper {
            width: 85%;
            max-width: 900px;
            height: 14px;
            background: #e2e8f0;
            border-radius: 20px;
            position: relative;
            margin: 0 auto;
        }

        #overall-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 20px;
            width: 0%;
            transition: width 0.5s ease;
        }

        .stage-marker {
            position: absolute;
            top: 0;
            width: 2px;
            height: 14px;
            background: rgba(255,255,255,0.6);
        }

        .stage-marker-label {
            position: absolute;
            top: 24px;
            left: 0;
            transform: rotate(-35deg);
            transform-origin: top left;
            font-size: 0.7rem;
            color: #1e293b;
            white-space: nowrap;
            font-weight: 700;
        }

        .marker-date {
            display: block;
            font-weight: 400;
            color: #64748b;
            margin-top: 2px;
            font-size: 0.65rem;
        }

        #today-marker {
            position: absolute;
            top: -6px;
            width: 24px;
            height: 24px;
            background: var(--primary);
            border: 4px solid white;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgb(0 0 0 / 0.2);
            z-index: 10;
            transform: translateX(-50%);
        }

        .footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 id="current-date"></h2>
    </div>

    <div class="current-phase-card">
        <div class="label">Current Focus</div>
        <h2 id="active-stage-name" style="margin: 10px 0;">--</h2>
        <div class="countdown-timer" id="countdown">--</div>
        <div class="label" id="timer-subtext">Time Remaining</div>
        
        <!-- Client Details Added Here -->
        <div class="client-info">
            Tom Nicolson | IC26.00.001
        </div>
    </div>

    <div id="timeline-container"></div>

    <footer class="footer">
        &copy; BDB15 Limited 2026
    </footer>
</div>

<div class="master-progress-container">
    <div class="progress-wrapper" id="progress-bar-base">
        <div id="overall-fill"></div>
        <div id="today-marker"></div>
    </div>
</div>

<script>
    const frameworkStages = [
        { name: "M1 STRATEGY", start: "2026-02-13", end: "2026-03-13" },
        { name: "M2 SYSTEMS / SOP", start: "2026-03-13", end: "2026-04-13" },
        { name: "M3 EFFICIENCY / QBR", start: "2026-04-13", end: "2026-05-13" }, // Active Stage
        { name: "M4 INNOVATION", start: "2026-05-13", end: "2026-06-13" },
        { name: "M5 STRESS-TEST", start: "2026-06-13", end: "2026-07-13" },
        { name: "M6 DECOUPLING", start: "2026-07-13", end: "2026-08-13" }
    ];

    function formatDate(dateStr) {
        const d = new Date(dateStr);
        const day = String(d.getDate()).padStart(2, '0');
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${day}-${months[d.getMonth()]}`;
    }

    function updateApp() {
        const now = new Date();
        const startTotal = new Date(frameworkStages[0].start);
        const endTotal = new Date(frameworkStages[frameworkStages.length - 1].end);
        
        document.getElementById('current-date').innerText = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

        let timelineHtml = '';
        let markersHtml = '';
        let currentStageFound = null;

        const totalDuration = endTotal - startTotal;
        const totalElapsed = now - startTotal;
        const totalPercent = Math.min(Math.max((totalElapsed / totalDuration) * 100, 0), 100);

        frameworkStages.forEach((stage) => {
            const sDate = new Date(stage.start);
            const eDate = new Date(stage.end);
            const startFormatted = formatDate(stage.start);
            const endFormatted = formatDate(stage.end);
            
            let statusClass = '';
            if (now > eDate) {
                statusClass = 'past';
            } else if (now >= sDate && now <= eDate) {
                statusClass = 'active';
                currentStageFound = stage;
            }

            timelineHtml += `
                <div class="stage-row">
                    <div class="date-range">${startFormatted} to ${endFormatted}</div>
                    <div class="stage-pill ${statusClass}">
                        <span>${stage.name}</span>
                        <small>${statusClass === 'active' ? '● CURRENT' : ''}</small>
                    </div>
                </div>`;

            const pos = ((sDate - startTotal) / totalDuration) * 100;
            markersHtml += `
                <div class="stage-marker" style="left: ${pos}%">
                    <div class="stage-marker-label">
                        ${stage.name}
                        <span class="marker-date">${startFormatted}</span>
                    </div>
                </div>`;
        });

        const stageNameEl = document.getElementById('active-stage-name');
        const countdownEl = document.getElementById('countdown');

        if (currentStageFound) {
            stageNameEl.innerText = currentStageFound.name;
            const diff = new Date(currentStageFound.end) - now;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            countdownEl.innerText = `${d}d ${h}h`;
        } else {
            stageNameEl.innerText = now > endTotal ? "Framework Complete" : "Not Started";
            countdownEl.innerText = "--";
        }

        document.getElementById('timeline-container').innerHTML = timelineHtml;
        
        const bar = document.getElementById('progress-bar-base');
        bar.querySelectorAll('.stage-marker').forEach(m => m.remove());
        bar.insertAdjacentHTML('beforeend', markersHtml);
        
        document.getElementById('overall-fill').style.width = totalPercent + '%';
        document.getElementById('today-marker').style.left = totalPercent + '%';
    }

    updateApp();
    setInterval(updateApp, 60000);
</script>

</body>
</html>
